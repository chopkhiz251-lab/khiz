<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artwork — Khiz Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/luxury.css">
  <style>
    .detail-page { padding: 7vw 5vw; min-height: calc(100vh - 82px); }
    .detail-grid { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1.05fr .95fr; gap: 7vw; align-items: center; }
    .detail-art { width: 100%; box-shadow: 18px 18px 0 var(--gold); }
    .detail-copy h1 { font-size: clamp(3rem, 6vw, 6rem); }
    .detail-price { color: var(--purple); font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0; }
    .detail-description { max-width: 520px; color: var(--muted); font-size: 1.05rem; }
    .specs { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 2rem 0; }
    .specs div { padding: 1.2rem 0; }
    .specs div + div { border-left: 1px solid var(--line); padding-left: 1.2rem; }
    .specs small { display: block; color: var(--muted); font-size: .62rem; letter-spacing: .15em; margin-bottom: .4rem; }
    .specs strong { font-size: .9rem; }
    .shipping-note { margin-top: 2rem; padding: 1rem 1.2rem; background: rgba(214,168,79,.1); }
    .shipping-note p { color: var(--muted); margin: .35rem 0 0; font-size: .82rem; }
    @media (max-width: 700px) { .detail-grid { grid-template-columns: 1fr; } .detail-art { box-shadow: 10px 10px 0 var(--gold); } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">KHIZ<span>.</span></a>
    <nav class="nav"><a href="index.html#home">Home</a><a href="index.html#shop">Collection</a><a href="index.html#about">The Artist</a><a href="index.html#contact">Contact</a></nav>
    <button class="cart-button" id="cartButton">Cart <span id="cartCount">0</span></button>
  </header>
  <main class="detail-page">
    <div class="detail-grid" id="artworkDetail"></div>
  </main>
  <aside class="cart-panel" id="cartPanel" aria-hidden="true"><div class="cart-head"><h2>Your collection</h2><button id="closeCart">×</button></div><div id="cartItems" class="cart-items"></div><div class="cart-foot"><div><span>Total</span><strong id="cartTotal">$0</strong></div><button class="button button-gold" id="checkoutButton">Continue to checkout</button></div></aside>
  <div class="overlay" id="overlay"></div>
  <script src="js/script.js"></script>
</body>
</html>
